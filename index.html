<style>
  :root{
    --ink:#0A090D;
    --ink-2:#121118;
    --line:rgba(198,161,91,.22);
    --gold:#C6A15B;
    --gold-soft:#E3C98F;
    --text:#EDE8DF;
    --muted:#9A948B;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:
      radial-gradient(900px 600px at 78% -8%, rgba(198,161,91,.16), transparent 62%),
      radial-gradient(700px 520px at 8% 108%, rgba(120,140,180,.10), transparent 60%),
      var(--ink);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Hiragino Sans","Yu Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(28px,7vw,80px) clamp(18px,5vw,40px);
  }
  .wrap{width:100%;max-width:760px}
  header{text-align:center;margin-bottom:clamp(30px,5vw,48px)}
  .mark{
    width:64px;height:64px;margin:0 auto 22px;display:block;
    filter:drop-shadow(0 0 18px rgba(198,161,91,.35));
  }
  h1{
    margin:0;
    font-size:clamp(24px,4.6vw,34px);
    font-weight:600;
    letter-spacing:.02em;
  }
  .sub{
    margin:14px 0 0;
    color:var(--muted);
    font-size:clamp(13px,2.6vw,15px);
    line-height:1.7;
  }
  .hair{
    width:56px;height:1px;margin:26px auto 0;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  .cards{
    display:grid;
    gap:16px;
    grid-template-columns:1fr;
  }
  @media(min-width:620px){.cards{grid-template-columns:1fr 1fr}}
  a.card{
    display:flex;flex-direction:column;gap:10px;
    padding:26px 24px;
    text-decoration:none;color:inherit;
    background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
    border:1px solid var(--line);
    border-radius:16px;
    transition:border-color .2s ease,transform .2s ease,background .2s ease;
  }
  a.card:hover,a.card:focus-visible{
    border-color:rgba(198,161,91,.6);
    background:linear-gradient(160deg,rgba(198,161,91,.11),rgba(255,255,255,.015));
    transform:translateY(-2px);
    outline:none;
  }
  .tag{
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--gold);font-weight:600;
  }
  .name{font-size:19px;font-weight:600;letter-spacing:.01em}
  .desc{font-size:13.5px;line-height:1.65;color:var(--muted);margin:0}
  .go{
    margin-top:8px;font-size:12.5px;color:var(--gold-soft);
    display:inline-flex;align-items:center;gap:6px;
  }
  .go svg{transition:transform .2s ease}
  a.card:hover .go svg{transform:translateX(3px)}
  footer{
    margin-top:clamp(34px,6vw,52px);
    text-align:center;
    font-size:12px;
    color:#6E6960;
    line-height:1.8;
  }
  footer a{color:#8C867C;text-decoration:none;border-bottom:1px solid rgba(140,134,124,.3)}
  footer a:hover{color:var(--gold-soft)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#E3C98F"/>
          <stop offset="1" stop-color="#B98F44"/>
        </linearGradient>
      </defs>
      <circle cx="40" cy="24" r="17" fill="url(#g)"/>
      <circle cx="31.5" cy="20" r="15" fill="#0A090D"/>
      <circle cx="18" cy="46" r="1.6" fill="#E3C98F" opacity=".9"/>
      <circle cx="27" cy="55" r="1.1" fill="#E3C98F" opacity=".65"/>
      <circle cx="12" cy="34" r="1" fill="#E3C98F" opacity=".5"/>
    </svg>
    <h1>운세 · 사주</h1>
    <p class="sub">두 곳의 운세 사이트로 안내합니다.<br>아래에서 원하는 곳을 골라 주세요.</p>
    <div class="hair" aria-hidden="true"></div>
  </header>

  <main class="cards">
    <a class="card" href="https://koki839.github.io/mukwoldang-saju/">
      <span class="tag">한국어 · 사주</span>
      <span class="name">묵월당 사주</span>
      <p class="desc">태어난 그 순간의 하늘을 여덟 글자로. 정통 만세력 사주팔자, 이별·재회 치유 사주, 연애 궁합까지 한자리에서.</p>
      <span class="go">사이트로 이동
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>
    </a>

    <a class="card" href="https://koki839.github.io/yumekawa-uranai/">
      <span class="tag">日本語 · 星占い</span>
      <span class="name">ゆめかわ星占い</span>
      <p class="desc">ゆめかわいい星空の下で読む、やさしい星座占い。今日の運勢と恋愛運を、かわいい動物たちと一緒に。</p>
      <span class="go">サイトへ移動する
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>
    </a>
  </main>

  <footer>
    <p>묵월당 사주 · ゆめかわ星占い</p>
  </footer>
</div>
